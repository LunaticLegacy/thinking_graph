# Copy this file to `app_config.toml` before first run.

[server]
host = "0.0.0.0"
port = 5000
debug = false
enable_cors = false
allow_runtime_settings_write = false
allow_db_fallback = false
trusted_proxy_hops = 0

[auth]
secret_key = "change-this-in-production"
trusted_identity_header = ""
session_cookie_name = "thinking_graph_session"
session_cookie_secure = true
session_cookie_samesite = "Lax"
session_cookie_domain = ""
permanent_session_days = 30

[paths]
template_dir = "templates"
static_dir = "static"
data_dir = "data"
project_db_path = "data/thinking_graph.db"
default_db_path = ""

[database]
db_path = ""

[llm]
backend = "remote_api"

[llm.remote_api]
api_key = ""
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"

[llm.local_api]
api_key = ""
base_url = "http://127.0.0.1:11434/v1"
model = "qwen2.5:7b"

[llm.local_runtime]
model = "qwen2.5-7b-instruct"
model_dir = "models"
npu_device = "NPU"
require_npu = true
onnx_provider = ""
